[platformio]
default_envs = esp32s3, esp32s3_bench

[env:esp32s3]
; Pinned: platform 6.13.0 ships framework-espidf 5.5.3, the last platform release on ESP-IDF 5.x.
; Do not change without a blueprint diff.
platform = espressif32 @ 6.13.0
board = esp32-s3-devkitc-1
framework = espidf

; N16R8: 16 MB flash, octal PSRAM. Flash and PSRAM modes are set in sdkconfig.defaults
; (board_build.arduino.memory_type is only read by the Arduino builder).
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
; Files embedded by a component (EMBED_TXTFILES) must also be listed here, or PlatformIO cannot
; find the generated .S file (M6: the control frame vectors for the boot self-test).
board_build.embed_txtfiles =
    components/comms/test_vectors/control_frame_vectors.txt

upload_speed = 921600
monitor_speed = 115200
; log2file (last, so decoded backtraces are logged too) writes logs/device-monitor-YYMMDD-HHMMSS.log
; under the folder the monitor starts in (PlatformIO 6.2.0, filters/log2file.py).
monitor_filters = default, esp32_exception_decoder, log2file

; Bench build (M7b, M7c): the same firmware plus the bench-only sdkconfig overlay
; sdkconfig.defaults.bench (task table, M7c latency histograms). Generated: sdkconfig.esp32s3_bench.
; Flash this one on the bench: pio run -e esp32s3_bench -t upload
[env:esp32s3_bench]
extends = env:esp32s3
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.defaults.bench

; M7c R5 experiment builds (bench only, not in default_envs: build each with -e). Each adds one
; overlay after the bench overlay. Baseline (a) is esp32s3_bench.
;   pio run -e esp32s3_r5b -t upload
[env:esp32s3_r5b]
extends = env:esp32s3
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.defaults.bench;sdkconfig.defaults.r5b

[env:esp32s3_r5c]
extends = env:esp32s3
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.defaults.bench;sdkconfig.defaults.r5c

[env:esp32s3_r5d]
extends = env:esp32s3
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.defaults.bench;sdkconfig.defaults.r5d

[env:esp32s3_r5e]
extends = env:esp32s3
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.defaults.bench;sdkconfig.defaults.r5e

; M7c diagnostics (bench only, not in default_envs): Core 0 memory corruption under page serving.
; heapdiag: heap poisoning (comprehensive), stack protector (strong), heap integrity check every
; second. heapdiag_nommap: the same with memory-mapped LittleFS off (isolation; its Core 1 timings
; do not count). docs/M7c_package.md section 8c.
[env:esp32s3_heapdiag]
extends = env:esp32s3
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.defaults.bench;sdkconfig.defaults.heapdiag

[env:esp32s3_heapdiag_nommap]
extends = env:esp32s3
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.defaults.bench;sdkconfig.defaults.heapdiag;sdkconfig.defaults.nommap
